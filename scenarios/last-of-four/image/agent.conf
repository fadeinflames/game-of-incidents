# mon-agent: scrapes the internal hosts and pushes the samples to the hosted metrics service.
[agent]
interval_sec = 10
targets = db-primary.core.internal, db-replica.core.internal, issuer-01.core.internal, issuer-02.core.internal
ingest = ingest.telemetry.example

[dns]
# the internal DNS cluster, asked in this order; the next resolver is tried on a timeout or a server failure
resolvers = 127.0.0.21, 127.0.0.22, 127.0.0.23, 127.0.0.24
timeout_sec = 2
# static pins in hosts(5) format, consulted before DNS. For emergencies only, normally empty.
static_hosts = /etc/mon-agent/static-hosts
