# Settings of the rebuild job (dns-rebuild).
# OPS-3117: OS upgrade of the DNS replicas, bullseye -> bookworm. One replica a day, rebuilt in place.
ticket = OPS-3117
# options passed to /opt/dns-provision/provision for every replica
provision_opts = --os bookworm --auto-forwarders
# name the health check asks the new instance for
healthcheck_name = db-primary.core.internal
