# issuer: certificate issuance. The file is re-read for every order.
[issuer]
interval_sec = 5
# the parties an order talks to
database = db-primary.core.internal
validation_points = vp-east.vantage.example, vp-west.vantage.example
transparency_logs = log-a.translog.example, log-b.translog.example

[dns]
# the internal DNS cluster, asked in this order; the next resolver is tried on a timeout or a server failure
resolvers = 127.0.0.21, 127.0.0.22, 127.0.0.23, 127.0.0.24
timeout_sec = 2
# static pins in hosts(5) format, consulted before DNS. For emergencies only, normally empty.
static_hosts = /etc/issuer/static-hosts
