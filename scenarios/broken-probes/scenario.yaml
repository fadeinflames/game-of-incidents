version: 2
slug: broken-probes
title: "Сломанные пробы"
summary: "После релиза 2.4.0 раскатка web зависла: новые поды не становятся Ready, из трёх реплик в сервисе остались две. Пайплайн отчитался «успешно»."
type: "Kubernetes, readiness/liveness, rollout"
difficulty: JUNIOR
durationMin: 20
tags: [kubernetes, probes, rollout]

contextJson:
  infra: "Кластер kind из одной ноды: Deployment web (3 реплики) за Service web в namespace default"
  services: ["web"]
  setup: "Релиз 2.4.0 переименовал эндпоинт здоровья приложения. Deployment обновили через пайплайн, пробы никто не трогал."
  time: "Четверг, 15:20"
eventsJson:
  - { t: 0, type: alert, title: "DeploymentRolloutStuck: web", body: "Раскатка web не завершилась за 10 минут; endpoints у сервиса: 2 из 3." }
  - { t: 5, type: event, title: "Пайплайн", body: "Джоба deploy зелёная, «kubectl set image» отработал." }
hintsJson:
  - { level: 1, penalty: 0,  text: "Направление: раскатка не завершается, потому что новые поды не проходят пробы. Спроси у кластера, что именно не так с новыми подами." }
  - { level: 2, penalty: 5,  text: "Инструмент: kubectl describe pod <новый pod> покажет Events с ответом пробы; сравни путь пробы в Deployment и путь здоровья в новой версии (env HEALTH_PATH)." }
  - { level: 3, penalty: 15, text: "Почти ответ: readiness и liveness ходят на /health, а версия 2.4.0 отвечает на /healthz. Поправь путь проб в Deployment (kubectl edit / patch) и дождись rollout." }
actionsJson: []
gmScriptJson: null

brief: brief.md
debrief: debrief.md
guide: guide.md   # teaching stages, revealed one by one (tag: tutorial)

# the grader demands release 2.4.0, which exists only after break.sh: the unbroken cluster must NOT pass
test: { baseline: fail }

environment:
  kind: kubernetes
  image: wom-tools:dev
  cluster: { nodes: 1 }
  manifests: ./k8s
  images: ["wom-scenario/broken-probes:dev"]
  build: ./image
  break: break.sh
  check: check.sh
  solve: solve.sh
  ttlMin: 45
  startup: { expectedSec: 60 }
  resources: { cpus: 1, memoryMb: 384, pids: 256 }
  network: { egress: none }
  services: []
  shell: { user: oncall, cwd: /home/oncall, shell: /bin/bash, sudo: true }
  hostname: bastion
  writable: ["/home", "/root", "/etc"]
