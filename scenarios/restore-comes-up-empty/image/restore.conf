# Settings of a temporary instance started from a backup (see README.md next to this file). Not a production config.
port = 5434
listen_addresses = '127.0.0.1'
unix_socket_directories = '/var/run/postgresql'
hba_file = '/srv/restore/pg_hba.conf'
ident_file = '/etc/postgresql/15/main/pg_ident.conf'
shared_buffers = 16MB
log_line_prefix = '%m [%p] '
log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'
