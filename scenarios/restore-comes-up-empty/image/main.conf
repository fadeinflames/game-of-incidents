# shop production cluster (15/main): local overrides of the Debian defaults
listen_addresses = '127.0.0.1'
shared_buffers = 32MB
# the streaming replica (cluster 15/replica) may fall behind for a while: keep some WAL for it
wal_keep_size = 128MB
log_statement = 'mod'
log_replication_commands = on
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'
