# pg_hba.conf of the production cluster 15/main
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     peer
# applications and engineers on this host
host    all             all             127.0.0.1/32            scram-sha-256
# streaming replication: the standby (cluster 15/replica) runs on this host
host    replication     replicator      127.0.0.1/32            scram-sha-256
