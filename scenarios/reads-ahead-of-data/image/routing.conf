# tokend: which database cluster serves the install_tokens table.
# Reads and writes are routed separately, so that a table can be moved between clusters without downtime.
# Apply a change with:  service tokend reload      The routing in effect:  curl -s localhost:8080/admin/routing

[clusters]
db-old = 127.0.0.1:3306
db-new = 127.0.0.1:3307

[install_tokens]
reads = db-old
writes = db-old
