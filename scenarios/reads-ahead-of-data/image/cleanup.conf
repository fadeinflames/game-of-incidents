# token-cleanup: deletes install tokens that expired more than retention_days ago.
# Cron starts it every minute (/etc/cron.d/token-cleanup). A run works in small batches until the end of the minute,
# the next run picks up where the previous one stopped. The settings are read again before every batch.
enabled = no
retention_days = 30
batch_rows = 80
batch_pause_sec = 2
