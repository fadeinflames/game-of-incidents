# The platform team's capacity controller: it owns the replica count of runs/deployment/dispatcher and takes the
# bounds from the capacity plan (ConfigMap capacity-plan). Every plan it applies is kept in capacity-plan-history.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-controller
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capacity-controller
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capacity-controller
  namespace: platform
subjects:
  - { kind: ServiceAccount, name: capacity-controller, namespace: platform }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capacity-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capacity-controller
  namespace: runs
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capacity-controller
  namespace: runs
subjects:
  - { kind: ServiceAccount, name: capacity-controller, namespace: platform }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capacity-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capacity-plan
  namespace: platform
  labels: { app: capacity-controller }
data:
  plan.conf: |
    # Capacity plan for capacity-controller. Generated by plan-gen from the sizing sheet.
    # The controller applies this object as it is and keeps every applied revision in capacity-plan-history.
    [plan]
    generated_at = 2026-10-27T08:41:02Z
    sizing_input = sizing sheet snapshot 2026-10-26: dispatcher peak 6.0 jobs/s, 1 job/s per pod, headroom 25 %
    change       = CAP-702: quarterly resize of the dispatcher pool

    [pool dispatcher]
    min_replicas    = 8
    max_replicas    = 12
    backlog_per_pod = 20
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capacity-plan-history
  namespace: platform
  labels: { app: capacity-controller }
data:
  rev-0039: |
    # revision 39, applied 2026-02-03T10:02:17Z by capacity-controller
    # Capacity plan for capacity-controller. Generated by plan-gen from the sizing sheet.
    # The controller applies this object as it is and keeps every applied revision in capacity-plan-history.
    [plan]
    generated_at = 2026-02-03T09:14:11Z
    sizing_input = sizing sheet snapshot 2026-02-01: dispatcher peak 1.4 jobs/s, 1 job/s per pod, headroom 25 %
    change       = CAP-655: first plan for the dispatcher pool

    [pool dispatcher]
    min_replicas    = 2
    max_replicas    = 4
    backlog_per_pod = 20
  rev-0040: |
    # revision 40, applied 2026-06-16T08:30:52Z by capacity-controller
    # Capacity plan for capacity-controller. Generated by plan-gen from the sizing sheet.
    # The controller applies this object as it is and keeps every applied revision in capacity-plan-history.
    [plan]
    generated_at = 2026-06-16T07:55:40Z
    sizing_input = sizing sheet snapshot 2026-06-15: dispatcher peak 3.6 jobs/s, 1 job/s per pod, headroom 25 %
    change       = CAP-688: resize after the mobile teams moved their builds here

    [pool dispatcher]
    min_replicas    = 5
    max_replicas    = 8
    backlog_per_pod = 20
  rev-0041: |
    # revision 41, applied 2026-10-27T09:06:33Z by capacity-controller
    # Capacity plan for capacity-controller. Generated by plan-gen from the sizing sheet.
    # The controller applies this object as it is and keeps every applied revision in capacity-plan-history.
    [plan]
    generated_at = 2026-10-27T08:41:02Z
    sizing_input = sizing sheet snapshot 2026-10-26: dispatcher peak 6.0 jobs/s, 1 job/s per pod, headroom 25 %
    change       = CAP-702: quarterly resize of the dispatcher pool

    [pool dispatcher]
    min_replicas    = 8
    max_replicas    = 12
    backlog_per_pod = 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-controller
  namespace: platform
  labels: { app: capacity-controller }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: capacity-controller }
  template:
    metadata:
      labels: { app: capacity-controller }
    spec:
      serviceAccountName: capacity-controller
      terminationGracePeriodSeconds: 5
      containers:
        - name: controller
          image: wom-scenario/below-the-baseline:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: controller }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
