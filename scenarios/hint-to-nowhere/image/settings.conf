# board-api: runtime settings.
# The service reads this file at start and on reload:   sudo service board-api reload
# What the running service uses right now:              curl -s localhost:8080/admin/settings

# How many items a list page returns.
page_size = 20

# Query tuning, PERF-311. On large accounts the optimizer picked a bad plan for the two list queries,
# so each of them is pinned to an index: the value goes into FORCE INDEX (...) of the query.
# An empty value (or "off") removes the pin and leaves the choice of the index to the optimizer.
tasks_list_index = idx_tasks_owner
feed_index = idx_comments_author
