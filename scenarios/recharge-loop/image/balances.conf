# Managed by cfgsync: local changes are overwritten on the next run.
# Template: redis/primary.conf.tmpl    Host: billing-01    Instance: balances    Role: primary

bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
logfile /var/log/redis-balances/redis.log
dir /var/lib/redis/balances
dbfilename dump.rdb

# Persistence on the primary: RDB snapshots only (the append-only file is kept by the replicas)
save 60 1
appendonly no

# Replication: a full resync is streamed to the replicas without a delay
repl-diskless-sync yes
repl-diskless-sync-delay 0
