# Managed by cfgsync: local changes are overwritten on the next run.
# Template: redis/replica.conf.tmpl    Host: billing-01    Instance: balances-r2    Role: replica

bind 127.0.0.1
port 6381
protected-mode yes
daemonize no
logfile /var/log/redis-balances-r2/redis.log
dir /var/lib/redis/balances-r2
dbfilename dump.rdb

# Persistence on a replica: append-only file, plus an occasional snapshot
appendonly yes
appendfsync everysec
save 900 1

# Replication: follow the primary of the balances cluster
replicaof 127.0.0.1 6379
replica-read-only yes
replica-serve-stale-data yes
