# gitstored: git storage service of git-03 (owner: storage team)
# where the worker listens
listen = 127.0.0.1:8075
# where the repositories live
root = /var/lib/git
# object cache of the worker, MiB; allocated in one piece when the worker starts
cache_mb = 332
# a worker that died is replaced after this many seconds
restart_delay = 90
