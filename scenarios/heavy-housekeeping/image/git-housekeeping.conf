# git-housekeeping: routine maintenance of the repositories under /var/lib/git (cron, every minute)
# the whole job: yes | no
enabled = yes
# a repository is due when it has more pack files than this ...
max_packs = 10
# ... or more loose objects than this
max_loose = 150
# repositories that are never maintained, separated by spaces (group/name.git)
exclude =
