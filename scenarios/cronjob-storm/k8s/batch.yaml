apiVersion: v1
kind: Namespace
metadata:
  name: batch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: batch
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: wom-scenario/cronjob-storm:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: batch
spec:
  selector: { app: api }
  ports:
    - { port: 80, targetPort: http }
---
# data team: nightly export of the reporting tables to object storage (~15 min)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-export
  namespace: batch
  labels: { app: nightly-export }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: { app: nightly-export }
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: nightly-export }
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: wom-scenario/cronjob-storm:dev
              imagePullPolicy: IfNotPresent
              command: ["sh", "/app/export.sh"]
              env:
                - { name: EXPORT_SECONDS, value: "900" }
                - { name: PGHOST, value: postgres.data.svc }
                - { name: S3_BUCKET, value: reports-export }
              resources:
                requests: { cpu: 50m, memory: 16Mi }
                limits: { cpu: 100m, memory: 32Mi }
