version: 2
slug: backup-permissions
title: "Недостающие права"
summary: "После «харднинга» прав ночной бэкап приложения падает с Permission denied. Последний удачный архив трёхдневной давности."
type: "Linux, permissions, cron, backup"
difficulty: MIDDLE
durationMin: 25
tags: [linux, permissions, cron, backup]

contextJson:
  infra: "Один VM app-01 (Debian 12): приложение хранит данные в /srv/app/data, ночной cron под пользователем backup шифрует их и кладёт в /var/backups/app"
  services: ["cron", "backup"]
  setup: "Три дня назад Security «закрыла лишние права» на ключах и каталогах. С тех пор бэкапы не создаются, но никто не заметил: алерт был на «job запустился», а не на «архив появился»."
  time: "Пятница, 09:15"
eventsJson:
  - { t: 0, type: alert, title: "BackupAge > 48h", body: "Последний архив в /var/backups/app старше 48 часов." }
  - { t: 8, type: event, title: "Вопрос от Security", body: "Мы ничего не ломали, только убрали лишние права. Не откатывайте всё подряд." }
hintsJson:
  - { level: 1, penalty: 0,  text: "Направление: бэкап пишет лог. Найди, на каком именно шаге он падает, а не почему «в целом»." }
  - { level: 2, penalty: 5,  text: "Инструмент: sudo -u backup /usr/local/bin/backup.sh воспроизводит проблему сразу; ls -l на файлы, которые он читает, и id backup покажут, чего не хватает." }
  - { level: 3, penalty: 15, text: "Почти ответ: пользователю backup нужен доступ на чтение к ключу и к каталогу данных через группу, а не через 777. Ключ не должен быть читаем всем." }
actionsJson: []
gmScriptJson: null

brief: brief.md
debrief: debrief.md

environment:
  kind: container
  image: wom-scenario/backup-permissions:dev
  build: ./image
  break: break.sh
  check: check.sh
  solve: solve.sh
  ttlMin: 50
  resources: { cpus: 1, memoryMb: 384, pids: 256 }
  network: { egress: none }
  services: []
  shell: { user: oncall, cwd: /home/oncall, shell: /bin/bash, sudo: true }
  hostname: app-01
  writable: ["/etc", "/var", "/home", "/root", "/srv"]
