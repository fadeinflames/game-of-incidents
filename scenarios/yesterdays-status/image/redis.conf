# Redis of budget-01: cached access statuses (access:*), the queue of budget updates (queue:budget-updates),
# the sessions of the customer portal (session:*), counters (meter:seq, stats:*)
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
logfile /var/log/redis/redis.log
dir /var/lib/redis

# the queue must survive a restart
appendonly yes
appendfsync everysec
save ""
