# budget-worker: local configuration, read at start

[database]
dsn = host=127.0.0.1 port=5432 dbname=budgets user=budget password=bw-rw-58c1 connect_timeout=3

[redis]
host = 127.0.0.1
port = 6379
queue = queue:budget-updates

[settings]
# everything that tunes the worker is served by settingsd
url = http://127.0.0.1:8500
namespace = budget-worker
refresh_sec = 15

[overrides]
# A key set here wins over the value from settingsd. Meant for the case when settingsd cannot be used.
# The keys are the ones of the namespace, for example:
# queue.batch_size = 2
