# usage-meter: stands in for the gateway nodes gw-1..gw-4 on this host

[api]
url = http://127.0.0.1:8080

[redis]
host = 127.0.0.1
port = 6379
queue = queue:budget-updates

[meter]
customers = 1001-1060
tick_sec = 1.05
# records the nodes had buffered are delivered one per this many ticks
buffered_every_ticks = 8
buffer = /var/lib/usage-meter/buffered.jsonl
