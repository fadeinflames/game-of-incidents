# What the removal of the mesh (PLAT-1873) left behind. No mesh is installed: these are plain objects.
# The removal went through the workloads of istio-system by hand; cluster-scoped objects and the things other
# charts own were not on the list. The injector webhook itself is created by break.sh (it would block the
# application pods at start-up otherwise).

# The metrics Service of the control plane, owned by the monitoring chart, so it survived. It never had the
# webhook port (443), and there are no pods behind it any more.
apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app: istiod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: stage-monitoring
  annotations:
    meta.helm.sh/release-name: stage-monitoring
    meta.helm.sh/release-namespace: monitoring
spec:
  selector: { app: istiod }
  ports:
    - { name: http-monitoring, port: 15014, targetPort: 15014 }
---
