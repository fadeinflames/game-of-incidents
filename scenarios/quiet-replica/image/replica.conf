# streaming standby of 15/main (cluster 15/replica): failover target, reports read from here. Owned by the DBA team.
listen_addresses = '127.0.0.1'
shared_buffers = 16MB
# a hot standby needs at least as many connection slots as its primary
max_connections = 40
hot_standby = on
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'
