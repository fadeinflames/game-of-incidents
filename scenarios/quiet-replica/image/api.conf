# gate-api: the HTTP front of the platform
[api]
listen_host = 127.0.0.1
listen_port = 8080
# request workers are shared by all endpoints; a request that finds none free within queue_wait_sec is answered 503
workers = 12
queue_wait_sec = 2

[database]
# permission data must be fresh: permission checks and token writes go to the primary, never to the standby
dsn = host=127.0.0.1 port=5432 dbname=authz user=gate_api password=ga-5Tq9wLx2 connect_timeout=3
# a permission check that finds no free connection slot on the primary waits for one this long
connect_wait_sec = 8

[tokens]
ttl_min = 60
# a token write that fails or does not finish in attempt_timeout_sec is tried again, up to attempts times
attempt_timeout_sec = 3
attempts = 5
retry_delay_sec = 0.3
