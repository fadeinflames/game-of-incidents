# token-sweeper: background cleanup of the authz database (owner: the data hygiene team)
[sweep]
# access tokens that expired before this date are removed; later ones stay, the audit team still needs them
expired_before = 2026-06-01
workers = 4
# installs per transaction: a batch is applied as a whole or not at all
batch_installs = 40

[throttle]
# the sweep must not make the standby fall behind: a probe measures the replication lag once a second (a marker row
# written on the primary is awaited on the standby); after every install the worker waits while the lag is above
# the limit, then pauses for pace_ms
standby_dsn = host=127.0.0.1 port=5433 dbname=authz user=sweeper password=sw-8Hn3cVd7 connect_timeout=3
max_replica_lag_sec = 5.0
pace_ms = 1500
report_sec = 10

[control]
# while this file exists the workers commit what they have done and stay idle; remove it to resume the sweep
pause_file = /var/lib/token-sweeper/pause

[database]
dsn = host=127.0.0.1 port=5432 dbname=authz user=sweeper password=sw-8Hn3cVd7 connect_timeout=3
