# authz primary (cluster 15/main): local overrides of the Debian defaults. Owned by the DBA team.
listen_addresses = '127.0.0.1'
shared_buffers = 32MB
max_connections = 40
superuser_reserved_connections = 3
# the streaming standby (cluster 15/replica) may fall behind for a while: keep some WAL for it
wal_keep_size = 128MB
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'
