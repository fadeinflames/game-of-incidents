# changefeed: ships row changes of the objects table to billing
[database]
dsn = host=127.0.0.1 port=5432 dbname=metadata user=changefeed password=cf-own-41c9 connect_timeout=3
# a session is closed and opened again after this many seconds (the balancer in front of the cluster drops old sessions anyway)
conn_max_age_sec = 30
reconnect_delay_sec = 2

[capture]
table = objects
trigger = objects_changefeed
# what to do with the capture trigger every time a session is opened:
#   recreate  drop the trigger and create it again (a simple idempotent way to keep it present and up to date)
#   verify    look it up in the catalog, create it only if it is missing
#   skip      do not touch the schema at all
on_connect = recreate

[output]
feed = /var/lib/changefeed/feed.jsonl
offset_file = /var/lib/changefeed/offset
poll_sec = 1
