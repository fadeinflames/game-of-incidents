# meta-01: local settings on top of the packaged postgresql.conf
shared_buffers = 48MB
max_connections = 30
superuser_reserved_connections = 5

# OPS-1184: autovacuum was hurting the p99 latency of the data path, throttled as far as it goes
autovacuum_vacuum_cost_delay = 100ms
autovacuum_vacuum_cost_limit = 5
