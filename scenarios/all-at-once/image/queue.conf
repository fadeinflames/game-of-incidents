# redis-queue on alerts-01: the job queues of the security alerts service
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
logfile /var/log/redis-queue/redis.log
dir /var/lib/redis/queue
dbfilename dump.rdb

# queued jobs survive a restart: a snapshot once a minute when jobs move, and one on shutdown
save 60 100
appendonly no
