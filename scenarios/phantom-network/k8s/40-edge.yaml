apiVersion: v1
kind: ConfigMap
metadata: { name: edge-gateway, namespace: default }
data:
  default.conf: |
    upstream orders { server order-service:8080; }
    server {
      listen 80;
      location /healthz { return 200 "ok\n"; }
      location /orders {
        proxy_pass http://orders/orders;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edge-gateway, namespace: default, labels: { app: edge-gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: edge-gateway } }
  template:
    metadata: { labels: { app: edge-gateway } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80, name: http }]
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
      volumes:
        - name: conf
          configMap: { name: edge-gateway }
---
apiVersion: v1
kind: Service
metadata: { name: edge-gateway, namespace: default }
spec:
  selector: { app: edge-gateway }
  ports: [{ port: 80, targetPort: http }]
