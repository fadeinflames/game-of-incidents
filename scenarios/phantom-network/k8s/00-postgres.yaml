apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: default }
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id serial PRIMARY KEY,
      created_at timestamptz NOT NULL DEFAULT now(),
      amount numeric(10,2) NOT NULL,
      method text NOT NULL,
      status text NOT NULL
    );
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: default, labels: { app: postgres } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=20", "-c", "log_min_duration_statement=5000"]
          env:
            - { name: POSTGRES_DB, value: orders }
            - { name: POSTGRES_USER, value: orders }
            - { name: POSTGRES_PASSWORD, value: orders }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "orders", "-d", "orders"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: init
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: default }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
