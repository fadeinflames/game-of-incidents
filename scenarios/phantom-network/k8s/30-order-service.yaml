apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: default, labels: { app: order-service } }
spec:
  replicas: 3
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: order-service
          image: wom-scenario/phantom-network:dev
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/order_service.py"]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: orders }
            - { name: PGPASSWORD, value: orders }
            - { name: PGDATABASE, value: orders }
            - { name: PAYMENT_URL, value: "http://payment-proxy:8081/charge" }
            # no socket timeout on the payment call, and the call happens inside the DB transaction
            - { name: PAYMENT_TIMEOUT, value: "" }
            - { name: WORKERS, value: "6" }
            - { name: PAYMENTS_CARD_ENABLED, value: "true" }
            - { name: ORDERS_ASYNC_PAYMENT, value: "false" }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources: { requests: { cpu: 30m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: default }
spec:
  selector: { app: order-service }
  ports: [{ port: 8080, targetPort: http }]
