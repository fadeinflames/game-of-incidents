# queue-redis: the job queue of the report pipeline. Lives in the data segment.
bind 127.0.30.11
port 6379
# clients come from the gateway address 127.0.30.1; the instance listens on a loopback address only
protected-mode no
daemonize no
logfile ""
dir /var/lib/redis/queue
# the queue survives a restart: every write goes to the append-only file, flushed once a second
save ""
appendonly yes
appendfsync everysec
maxclients 1000
maxmemory 96mb
maxmemory-policy noeviction
tcp-keepalive 60
