# seg-gw: the gateway between the application segment and the data segment.
# Owner: network team (NET). Changes go through a change request, see /var/log/seg-gw/changes.log.
#
#   application side (addresses the clients connect to)      data segment (real servers)
#   127.0.20.11:6380  ->  queue-redis                         127.0.30.11:6379
#   127.0.20.12:6380  ->  notify-redis                        127.0.30.12:6379
#
# Towards the data segment the gateway uses its own address 127.0.30.1.

global
    log stdout format raw daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    maxconn 400
    # one thread: the session limit below is then enforced exactly
    nbthread 1

defaults
    mode tcp
    log global
    log-format "%ci:%cp -> %fi:%fp %b/%s connect=%Tc total=%Tt in=%U out=%B state=%ts sessions=%ac"
    timeout connect 3s
    timeout client 10m
    timeout server 10m

frontend seg-a
    # one socket for every destination behind the gateway
    bind :6380
    # NET-policy 7.2: the gateway sets up at most 16 new sessions per second (protects the state table of the segment);
    # sessions over the limit wait in the listen queue
    rate-limit sessions 16
    maxconn 200
    backlog 64
    acl to_queue  dst 127.0.20.11
    acl to_notify dst 127.0.20.12
    tcp-request connection reject unless to_queue or to_notify
    use_backend queue-redis  if to_queue
    use_backend notify-redis if to_notify

backend queue-redis
    server queue-redis 127.0.30.11:6379 source 127.0.30.1 check inter 5s

backend notify-redis
    server notify-redis 127.0.30.12:6379 source 127.0.30.1 check inter 5s

listen stats
    mode http
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 5s
