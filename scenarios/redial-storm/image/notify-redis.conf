# notify-redis: the store of the notifier (deduplication keys and counters). Lives in the data segment.
bind 127.0.30.12
port 6379
# clients come from the gateway address 127.0.30.1; the instance listens on a loopback address only
protected-mode no
daemonize no
logfile ""
dir /var/lib/redis/notify
save ""
appendonly no
maxclients 1000
maxmemory 32mb
maxmemory-policy volatile-ttl
tcp-keepalive 60
