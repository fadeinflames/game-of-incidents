# Settings of the notifier. Read when the service starts.

# The store: notify-redis, reached through the segment gateway seg-gw.
store_host = 127.0.20.12
store_port = 6380

# The notifier does not keep a connection: every flush_interval_ms it connects, sends what has piled up, disconnects.
flush_interval_ms = 2000

# One attempt to connect: TCP connect plus the first reply of Redis must fit into this time.
connect_timeout_ms = 1500

# After a failed attempt: pause 1 s, 2 s, 4 s, then every 8 s; half of every pause is random.
reconnect_pause_ms = 1000
reconnect_backoff = 2
reconnect_pause_max_ms = 8000
reconnect_jitter = 0.5
