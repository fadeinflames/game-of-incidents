# Settings of the job runners (runner-1 ... runner-8). One file for all of them.
# Read when a runner starts and on `service runner-N reload` (a reload keeps the established connections).

# The job queue: queue-redis, reached through the segment gateway seg-gw.
queue_host = 127.0.20.11
queue_port = 6380

# Parallel job slots of one runner. Every slot holds its own connection to the queue.
slots = 8

# One attempt to open a connection: TCP connect plus the first reply of Redis must fit into this time.
dial_timeout_ms = 1000

# What the runner does after a failed attempt to open its connections.
# Pause before the next attempt, in milliseconds.
redial_pause_ms = 0
# The pause is multiplied by this factor after every failed attempt in a row (1 = the pause stays the same).
redial_backoff = 1
# Upper bound of the pause, in milliseconds.
redial_pause_max_ms = 30000
# Share of the pause that is random, from 0 to 1: the real pause is picked between pause * (1 - jitter) and pause.
redial_jitter = 0
# At most this many connection attempts per minute for one runner (0 = no limit).
redial_budget_per_min = 0
