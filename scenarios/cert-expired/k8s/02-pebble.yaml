# the ACME CA of the story ("Let's Encrypt"): Pebble, Let's Encrypt's own small test server. HTTP-01 on port 80.
apiVersion: v1
kind: Namespace
metadata:
  name: acme
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble-config
  namespace: acme
data:
  pebble.json: |
    {
      "pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "test/certs/localhost/cert.pem",
        "privateKey": "test/certs/localhost/key.pem",
        "httpPort": 80,
        "tlsPort": 443,
        "ocspResponderURL": "",
        "externalAccountBindingRequired": false,
        "retryAfter": { "authz": 3, "order": 5 },
        "keyAlgorithm": "ecdsa",
        "profiles": {
          "default": { "description": "90-day certificates", "validityPeriod": 7776000 }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: acme
  labels: { app: pebble }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pebble }
  template:
    metadata:
      labels: { app: pebble }
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config/pebble.json", "-dnsserver", "10.96.0.10:53"]
          env:
            - { name: PEBBLE_VA_NOSLEEP, value: "1" }
            - { name: PEBBLE_WFE_NONCEREJECT, value: "0" }
            # never reuse a valid authorization: every order must pass a fresh HTTP-01 challenge (default is 25 % reuse)
            - { name: PEBBLE_AUTHZREUSE, value: "0" }
          ports:
            - { containerPort: 14000, name: acme }
          volumeMounts:
            - { name: config, mountPath: /config }
          readinessProbe:
            tcpSocket: { port: acme }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
      volumes:
        - name: config
          configMap: { name: pebble-config }
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: acme
spec:
  selector: { app: pebble }
  ports:
    - { name: acme, port: 14000, targetPort: acme }
