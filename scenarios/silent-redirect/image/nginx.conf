user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 30;
    server_names_hash_bucket_size 64;

    log_format sites '$remote_addr [$time_local] $host "$request" $status $body_bytes_sent up=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log sites;

    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # OPS-2107: one site per file, grouped by kind (see /etc/nginx/CHANGELOG)
    include /etc/nginx/sites/*.conf;
    include /etc/nginx/sites/*/*.conf;
}
