# featuregen: builds the features file for the bot-scoring module of edge-proxy
[featuregen]
interval_sec = 20
query_file = /etc/featuregen/query.sql
output = /var/lib/edge/features/current.json
archive_dir = /var/lib/edge/features/archive
archive_keep = 40
# analytics nodes, queried in turn (the cluster balances metadata queries the same way)
nodes = n1, n2

[node:n1]
dsn = host=127.0.0.1 port=5432 dbname=analytics_n1 user=featuregen password=fg-r3adonly

[node:n2]
dsn = host=127.0.0.1 port=5432 dbname=analytics_n2 user=featuregen password=fg-r3adonly
