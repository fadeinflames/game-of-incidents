server {
    listen 80 default_server;
    server_name _;

    location /healthz {
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
