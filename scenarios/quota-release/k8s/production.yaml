apiVersion: v1
kind: Namespace
metadata:
  name: production
---
# platform team: the namespace may request at most 2 CPU in total (agreed with finance, do not touch without a ticket)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: production
spec:
  hard:
    requests.cpu: "2"
    pods: "20"
---
# platform team: no container may request less than 100m (scheduler packing) or more than 1 CPU
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-limits
  namespace: production
spec:
  limits:
    - type: Container
      min: { cpu: 100m }
      max: { cpu: "1" }
      defaultRequest: { cpu: 100m }
      default: { cpu: 500m }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: production
  labels: { app: worker, tier: batch }
spec:
  replicas: 4
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker, tier: batch }
    spec:
      containers:
        - name: worker
          image: wom-scenario/quota-release:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo worker ready; while true; do sleep 3600; done"]
          resources:
            requests: { cpu: 325m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: production
  labels: { app: cache }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: cache
          image: wom-scenario/quota-release:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_NAME, value: cache }
            - { name: APP_VERSION, value: "6.2" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: production
  labels: { app: report-api }
  annotations:
    kubernetes.io/change-cause: "release 1.7.4"
spec:
  replicas: 2
  selector:
    matchLabels: { app: report-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: report-api }
    spec:
      containers:
        - name: report-api
          image: wom-scenario/quota-release:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_NAME, value: report-api }
            - { name: APP_VERSION, value: "1.7.4" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 200m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: production
spec:
  selector: { app: report-api }
  ports:
    - { port: 80, targetPort: http }
