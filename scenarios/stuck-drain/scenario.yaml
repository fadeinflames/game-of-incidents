version: 2
slug: stuck-drain
title: "Застрявшие поды"
summary: "Плановое обновление ядра: drain ноды завис на database-1 и отвалился по таймауту, нода cordoned. PDB не отпускает реплику, а её зональный диск живёт там, где больше нет нод пула базы."
type: "Kubernetes, node drain, PDB, zonal PV, StatefulSet"
difficulty: MIDDLE
durationMin: 22
tags: [kubernetes, drain, pdb, statefulset, storage, maintenance]

contextJson:
  infra: "Кластер kind из 4 нод (control-plane + 3 воркера в зонах a / b / b-spare); namespace production: StatefulSet database (3, зональные PV), Deployment app-backend (5), PDB на оба"
  services: ["database", "app-backend"]
  setup: "Тикет INFRA-2291: обновить ядро на ноде базы в зоне b. Коллега начал drain, он завис."
  time: "Вторник, 14:00"
eventsJson:
  - { t: 0, type: msg, title: "Коллега в Slack", body: "«Начал drain ноды в зоне b по INFRA-2291, висит уже 20 минут и отвалился по таймауту. Нода cordoned. Передаю тебе, у меня встреча.»" }
  - { t: 2, type: event, title: "Инфра-команда", body: "Запасная нода в зоне b добавлена в кластер (пул spare), чтобы было куда переезжать." }
hintsJson:
  - { level: 1, penalty: 0,  text: "Направление: drain не висит просто так. Его сообщения об eviction говорят, кто держит: посмотри PDB в namespace production и метки нод." }
  - { level: 2, penalty: 5,  text: "Инструмент: kubectl get pdb -n production (ALLOWED DISRUPTIONS), kubectl get pv -o yaml (nodeAffinity по зоне), kubectl get nodes -L topology.kubernetes.io/zone,node-pool. Сравни зону диска database-1 с зонами нод в пуле db." }
  - { level: 3, penalty: 15, text: "Почти ответ: PDB должен быть minAvailable 2 (договорённость), запасную ноду зоны b надо пометить node-pool=db, после этого kubectl drain завершится и database-1 переедет." }
actionsJson: []
gmScriptJson: null

brief: brief.md
debrief: debrief.md

# the grader wants the maintenance node drained; the fresh cluster has no such node: it must NOT pass
test: { baseline: fail }

environment:
  kind: kubernetes
  image: wom-tools:dev
  cluster:
    nodes: 4
    workerLabels:
      - { topology.kubernetes.io/zone: ru-central1-a, node-pool: db }
      - { topology.kubernetes.io/zone: ru-central1-b, node-pool: db }
      - { topology.kubernetes.io/zone: ru-central1-b, node-pool: spare }
  manifests: ./k8s
  images: ["wom-scenario/stuck-drain:dev"]
  build: ./image
  break: break.sh
  check: check.sh
  solve: solve.sh
  ttlMin: 45
  startup: { expectedSec: 120, note: "Стенд из четырёх нод: control-plane и три воркера в разных зонах. Поднимается дольше обычного." }
  resources: { cpus: 1, memoryMb: 384, pids: 256 }
  network: { egress: none }
  services: []
  shell: { user: oncall, cwd: /home/oncall, shell: /bin/bash, sudo: true }
  hostname: bastion
  writable: ["/home", "/root", "/etc"]
