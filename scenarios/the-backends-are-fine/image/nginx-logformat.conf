# access log formats of this host (http context)
log_format edge '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent rt=$request_time account=$http_x_account ua="$http_user_agent"';
log_format gw   '$remote_addr [$time_iso8601] "$request" $status rt=$request_time caller=$http_x_caller';
