# Gateway of the entitlements service.
# OWNER: the billing team. Do not change anything in this file without them.
#
# Every consumer (one address = one consumer service) may send 5 lookups per second, with a short burst on top.
# The subscriptions database behind the service cannot take more: the limit is what keeps it alive for everyone.
limit_req_zone $binary_remote_addr zone=entitlements:1m rate=5r/s;

server {
    listen 127.0.0.1:9000;
    server_name entitlements-gw;

    access_log /var/log/nginx/entitlements-gw.access.log gw;
    error_log  /var/log/nginx/entitlements-gw.error.log warn;

    location /v1/entitlements/ {
        limit_req zone=entitlements burst=10 nodelay;
        limit_req_status 429;

        proxy_set_header X-Gateway entitlements-gw;
        proxy_pass http://127.0.0.1:9100;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9100;
    }

    location / {
        return 404;
    }
}
