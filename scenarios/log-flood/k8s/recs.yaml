apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-config
  namespace: default
data:
  DEBUG_PAYLOAD: "off"
  MODEL: rec-v14
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  namespace: default
  labels: { app: recommendation-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: recommendation-api }
  template:
    metadata:
      labels: { app: recommendation-api }
    spec:
      containers:
        - name: api
          image: wom-scenario/log-flood:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: LOG_DIR, value: /var/log/app }
            - name: DEBUG_PAYLOAD
              valueFrom: { configMapKeyRef: { name: recommendation-config, key: DEBUG_PAYLOAD } }
          ports:
            - { containerPort: 8080, name: http }
          volumeMounts:
            - { name: logs, mountPath: /var/log/app }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 30m, memory: 48Mi }
            limits: { memory: 128Mi }
        - name: log-shipper
          image: wom-scenario/log-flood:dev
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/shipper.py"]
          env:
            - { name: LOG_DIR, value: /var/log/app }
            - { name: SHIP_BYTES_PER_SEC, value: "300000" }
          ports:
            - { containerPort: 9102, name: metrics }
          volumeMounts:
            - { name: logs, mountPath: /var/log/app }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 48Mi }
      volumes:
        # node-local scratch for logs, capped so that a flood cannot take the node down with it
        - name: logs
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-api
  namespace: default
spec:
  selector: { app: recommendation-api }
  ports:
    - { port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: default
  labels: { app: traffic }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic }
  template:
    metadata:
      labels: { app: traffic }
    spec:
      containers:
        - name: loadgen
          image: wom-scenario/log-flood:dev
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/loadgen.py"]
          env:
            - { name: TARGET, value: "http://recommendation-api" }
          ports:
            - { containerPort: 9090, name: stats }
          resources:
            requests: { cpu: 30m, memory: 32Mi }
            limits: { memory: 64Mi }
