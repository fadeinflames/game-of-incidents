apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: backup
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: data
type: Opaque
stringData:
  username: backup
  password: b4ckup-r34d-0nly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: data
  labels: { app: database }
spec:
  replicas: 1
  selector:
    matchLabels: { app: database }
  template:
    metadata:
      labels: { app: database }
    spec:
      containers:
        - name: database
          image: wom-scenario/missing-permissions:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: database }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
          ports:
            - { containerPort: 5432, name: db }
          readinessProbe:
            httpGet: { path: /health, port: db }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: data
spec:
  selector: { app: database }
  ports:
    - { port: 5432, targetPort: db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-store
  namespace: backup
  labels: { app: backup-store }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backup-store }
  template:
    metadata:
      labels: { app: backup-store }
    spec:
      containers:
        - name: backup-store
          image: wom-scenario/missing-permissions:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: backup-store }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backup-store
  namespace: backup
spec:
  selector: { app: backup-store }
  ports:
    - { port: 8080, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-controller
  namespace: backup
---
# the "wide role" the backup was created with two years ago: cluster-admin for a backup job (security ticket SEC-1187)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-controller-admin
subjects:
  - { kind: ServiceAccount, name: backup-controller, namespace: backup }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: backup
  labels: { app: db-backup }
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: { app: db-backup }
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app: db-backup }
        spec:
          serviceAccountName: backup-controller
          restartPolicy: Never
          containers:
            - name: backup
              image: wom-scenario/missing-permissions:dev
              imagePullPolicy: IfNotPresent
              command: ["sh", "/app/backup.sh"]
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { memory: 64Mi }
