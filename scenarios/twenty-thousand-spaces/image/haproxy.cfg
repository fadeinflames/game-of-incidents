global
    log stdout format raw daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    maxconn 512

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend www
    bind 0.0.0.0:80
    default_backend forum

backend forum
    # a server stays in rotation while its check passes
    option httpchk GET /
    http-check expect status 200
    timeout check 1s
    default-server inter 3s fall 2 rise 2
    server web1 127.0.0.1:8001 check
    server web2 127.0.0.1:8002 check

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 5s
